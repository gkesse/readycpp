repos:
  - repo: local
    hooks:
      - id: readycpp-bash-tests
        name: Validation des tests unitaires bash
        entry: hooks/pre-commit/readycpp-bash-tests.sh
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
